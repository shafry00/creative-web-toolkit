<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; font-family: 'Space Grotesk', sans-serif; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    .overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .glitch-title {
      font-size: 6rem;
      font-weight: 700;
      color: white;
      position: relative;
      animation: glitch 2s infinite;
    }
    .glitch-title::before,
    .glitch-title::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .glitch-title::before {
      animation: glitch-1 0.3s infinite;
      color: #ff00de;
      z-index: -1;
    }
    .glitch-title::after {
      animation: glitch-2 0.3s infinite;
      color: #00fff9;
      z-index: -2;
    }
    @keyframes glitch-1 {
      0%, 100% { clip-path: inset(0 0 95% 0); transform: translate(-2px, -2px); }
      25% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 2px); }
      50% { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 1px); }
      75% { clip-path: inset(10% 0 80% 0); transform: translate(1px, -1px); }
    }
    @keyframes glitch-2 {
      0%, 100% { clip-path: inset(95% 0 0 0); transform: translate(2px, 2px); }
      25% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, -2px); }
      50% { clip-path: inset(10% 0 70% 0); transform: translate(1px, -1px); }
      75% { clip-path: inset(80% 0 10% 0); transform: translate(-1px, 1px); }
    }
    .subtitle {
      font-size: 1.5rem;
      color: rgba(255,255,255,0.6);
      margin-top: 1rem;
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .controls {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      z-index: 10;
    }
    .btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.2); }
    .btn.active { background: rgba(102, 126, 234, 0.5); border-color: #667eea; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="overlay">
    <h1 class="glitch-title" data-text="AESTHETIC">AESTHETIC</h1>
    <p class="subtitle">Glitch • Noise • Distortion</p>
  </div>
  <div class="controls">
    <button class="btn active" data-effect="glitch">Glitch</button>
    <button class="btn" data-effect="noise">Noise</button>
    <button class="btn" data-effect="wave">Wave</button>
    <button class="btn" data-effect="rgb">RGB Split</button>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
